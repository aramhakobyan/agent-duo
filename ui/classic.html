<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Duo — classic</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2128; --muted: #6a737d;
    --border: #e1e4e8; --accent: #4669d4;
    --lead-bg: #eef2fd; --lead-edge: #4669d4;
    --chal-bg: #eefaf2; --chal-edge: #2f9e5f;
    --human-bg: #fdf4e3; --human-edge: #c98a1b;
    --agree: #2f9e5f; --continue: #c98a1b; --err: #cf3f3f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1d2127; --text: #e2e6eb; --muted: #8b949e;
      --border: #30363d; --accent: #7a97ea;
      --lead-bg: #1d2638; --chal-bg: #1a2b22; --human-bg: #2e2617;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  .layout { display: flex; min-height: 100vh; }
  aside { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border);
          background: var(--panel); padding: 16px; overflow-y: auto; }
  main { flex: 1; padding: 20px 24px 120px; max-width: 980px; }
  h1 { font-size: 17px; margin: 0 0 14px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 12px; }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .04em; color: var(--muted); margin: 10px 0 3px; }
  textarea, input, select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 7px; background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 88px; resize: vertical; }
  button { border: 0; border-radius: 7px; padding: 8px 14px; font: inherit;
           cursor: pointer; background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--err);
                     border: 1px solid var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .runs { margin-top: 18px; }
  .run-item { padding: 9px 26px 9px 10px; border: 1px solid var(--border);
              border-radius: 8px; margin-bottom: 7px; cursor: pointer;
              position: relative; }
  .run-item.active { border-color: var(--accent); }
  .run-item .del { position: absolute; top: 6px; right: 6px; background: none;
                   color: var(--muted); padding: 0 4px; font-size: 13px; }
  .run-item .del:hover { color: var(--err); }
  .run-item .t { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .run-item .m { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 8px;
           border-radius: 10px; color: #fff; vertical-align: 1px; }
  .badge.running { background: var(--accent); }
  .badge.paused { background: #8a6bbf; }
  .badge.consensus { background: var(--agree); }
  .badge.no_consensus, .badge.stopped { background: var(--continue); }
  .badge.error { background: var(--err); }
  .meta { color: var(--muted); font-size: 12.5px; margin: 6px 0 18px; }
  .msg { max-width: 86%; margin: 14px 0; padding: 12px 14px; border-radius: 10px;
         border-left: 3px solid; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .who { font-size: 11.5px; font-weight: 600; margin-bottom: 6px;
              display: flex; gap: 8px; align-items: center; }
  .msg .who .chips { font-weight: 400; color: var(--muted); font-size: 11px; }
  .msg.lead  { background: var(--lead-bg);  border-color: var(--lead-edge); }
  .msg.chal  { background: var(--chal-bg);  border-color: var(--chal-edge);
               margin-left: auto; }
  .msg.human { background: var(--human-bg); border-color: var(--human-edge);
               margin: 14px auto; max-width: 70%; }
  .verdict-AGREE { color: var(--agree); font-weight: 600; }
  .verdict-CONTINUE { color: var(--continue); }
  .final { border: 1px solid var(--border); border-radius: 10px; padding: 16px;
           margin-top: 22px; background: var(--panel); white-space: pre-wrap;
           overflow-wrap: anywhere; }
  .composer { position: fixed; bottom: 0; left: 320px; right: 0;
              background: var(--panel); border-top: 1px solid var(--border);
              padding: 12px 24px; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { min-height: 44px; max-height: 140px; flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }
  code { background: rgba(127,127,127,.16); padding: 0 4px; border-radius: 4px;
         font-size: 12.5px; }
  .spin { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
          border: 2px solid var(--accent); border-top-color: transparent;
          animation: r 1s linear infinite; vertical-align: -1px; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (max-width: 760px) {
    .layout { flex-direction: column; } aside { width: auto; }
    .composer { left: 0; position: sticky; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Agent Duo <span>Claude × Codex debate</span></h1>
    <form id="startForm">
      <label>Task / hypothesis</label>
      <textarea id="task" placeholder='Hypothesis: 4h BTC momentum survives 10bps fees'></textarea>
      <label>Max rounds</label>
      <input id="rounds" type="number" min="1" max="20" value="5">
      <label>Who leads (research lead / PO vs engineer)</label>
      <select id="leadAgent">
        <option value="claude" selected>Claude leads · Codex challenges</option>
        <option value="codex">Codex leads · Claude challenges</option>
      </select>
      <label>Claude model</label>
      <select id="claudeModel"></select>
      <input id="claudeModelCustom" placeholder="full model ID"
             style="display:none; margin-top:5px">
      <label>Codex model</label>
      <select id="codexModel"></select>
      <input id="codexModelCustom" placeholder="model slug"
             style="display:none; margin-top:5px">
      <label>Codex reasoning effort</label>
      <select id="codexEffort"><option value="">model default</option></select>
      <details id="rolesBox" style="margin-top:10px">
        <summary class="hint" style="cursor:pointer">Roles (edit for this run)</summary>
        <label>Lead role</label>
        <textarea id="leadRole" spellcheck="false"></textarea>
        <label>Challenger role</label>
        <textarea id="chalRole" spellcheck="false"></textarea>
      </details>
      <label>Working directory (data & backtests)</label>
      <input id="workdir" placeholder="default: ./workspace">
      <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
        <button type="submit" id="startBtn">Start debate</button>
        <span class="hint" id="startHint"></span>
      </div>
    </form>
    <div class="runs" id="runs"></div>
  </aside>
  <main id="main"><p class="hint">Start a debate, or pick a run on the left.</p></main>
</div>
<div class="composer" id="composer" style="display:none">
  <textarea id="directorMsg"
    placeholder="Speak as the human director — requirements are binding for both agents (delivered before their next turn)"></textarea>
  <button id="sendBtn">Send</button>
  <button id="pauseBtn">Pause</button>
  <button class="secondary" id="stopBtn">Stop run</button>
</div>
<script>
const $ = id => document.getElementById(id);
let active = null, pollTimer = null;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
  .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>');
const api = (path, opts) => fetch(path, opts).then(r => r.json());

function stripProtocol(text) {
  return text.replace(/^\s*(CONFIDENCE|VERDICT):.*$/gim, '').trim();
}

function render(state) {
  const roles = {[state.lead.name]: 'lead', [state.challenger.name]: 'chal'};
  let h = `<h1>${esc(state.task)}</h1>
    <div class="meta">
      <span class="badge ${state.status}">${state.status}</span>
      &nbsp; lead: <b>${esc(state.lead.name)}</b> (${esc(state.lead.model || 'default')})
      · challenger: <b>${esc(state.challenger.name)}</b> (${esc(state.challenger.model || 'default')})
      · rounds ≤ ${state.max_rounds} · workdir ${esc(state.workdir)}
    </div>`;
  for (const t of state.turns) {
    if (t.kind === 'human') {
      h += `<div class="msg human"><div class="who">🧑 human director</div>${esc(t.text)}</div>`;
    } else {
      const chips = [
        t.round ? `round ${t.round}` : '',
        t.confidence != null ? `confidence ${t.confidence}/10` : '',
      ].filter(Boolean).join(' · ');
      h += `<div class="msg ${roles[t.agent] || 'lead'}">
        <div class="who">${roles[t.agent] === 'chal' ? '🛠' : '📐'} ${esc(t.agent)}
          <span class="chips">${chips} ·
            <span class="verdict-${t.verdict}">${t.verdict || ''}</span></span>
        </div>${esc(stripProtocol(t.text))}</div>`;
    }
  }
  if (state.status === 'running')
    h += `<p class="hint"><span class="spin"></span> debate in progress — agents are thinking / running work…</p>`;
  if (state.status === 'paused')
    h += `<p class="hint">⏸ paused — press Resume to continue (a turn already in flight finishes first)</p>`;
  if (state.error)
    h += `<div class="final" style="border-color:var(--err)"><b>Error:</b> ${esc(state.error)}</div>`;
  if (state.final_report)
    h += `<div class="final"><b>📋 Final report</b><br><br>${esc(state.final_report)}</div>`;
  $('main').innerHTML = h;
  $('composer').style.display = '';
  const live = state.status === 'running' || state.status === 'paused';
  $('sendBtn').disabled = $('stopBtn').disabled = $('pauseBtn').disabled = !live;
  $('pauseBtn').textContent = state.status === 'paused' ? 'Resume' : 'Pause';
}

async function poll() {
  if (!active) return;
  try {
    const state = await api(`/api/state/${active}`);
    if (state.status) render(state);
    if (['running', 'paused', 'starting'].includes(state.status))
      pollTimer = setTimeout(poll, 3000);
  } catch (e) { pollTimer = setTimeout(poll, 3000); }
  refreshRuns();
}

function select(id) {
  active = id;
  clearTimeout(pollTimer);
  poll();
}

async function refreshRuns() {
  const runs = await api('/api/runs');
  $('runs').innerHTML = runs.map(r => `
    <div class="run-item ${r.run_id === active ? 'active' : ''}" onclick="select('${r.run_id}')">
      <button class="del" title="Delete run"
        onclick="event.stopPropagation(); delRun('${r.run_id}')">✕</button>
      <div class="t">${esc(r.task)}</div>
      <div class="m"><span class="badge ${r.status}">${r.status}</span>
        ${r.turns} turns · ${esc(r.run_id)}</div>
    </div>`).join('');
}

async function delRun(id) {
  if (!confirm(`Delete run ${id} permanently? Its transcript, report and state are removed from disk.`)) return;
  const res = await api(`/api/delete/${id}`, {method: 'POST'});
  if (res.error) { alert(res.error); return; }
  if (active === id) {
    active = null; clearTimeout(pollTimer);
    $('main').innerHTML = '<p class="hint">Start a debate, or pick a run on the left.</p>';
    $('composer').style.display = 'none';
  }
  refreshRuns();
}

let codexModels = [], defaultRoles = {lead: '', challenger: ''};

function fillSelect(sel, models, emptyLabel) {
  let h = emptyLabel ? `<option value="">${esc(emptyLabel)}</option>` : '';
  h += models.map(x => `<option value="${x.id}">${esc(x.label)}${
    x.description ? ' — ' + esc(x.description) : ''}</option>`).join('');
  h += `<option value="__custom">Custom model ID…</option>`;
  sel.innerHTML = h;
}
// resolve a select+custom-input pair to the chosen model id
const modelOf = (selId, inpId) =>
  $(selId).value === '__custom' ? $(inpId).value.trim() : $(selId).value;

async function loadModels() {
  try {
    const m = await api('/api/models');
    fillSelect($('claudeModel'), m.claude);
    $('claudeModel').value = 'sonnet';
    codexModels = m.codex || [];
    fillSelect($('codexModel'), codexModels, 'account default');
  } catch (e) {
    fillSelect($('claudeModel'), [{id: 'opus'}, {id: 'sonnet'}, {id: 'haiku'}]);
    $('claudeModel').value = 'sonnet';
    fillSelect($('codexModel'), [], 'account default');
  }
  updateEfforts();
  try {
    defaultRoles = await api('/api/roles');
    $('leadRole').value = defaultRoles.lead;
    $('chalRole').value = defaultRoles.challenger;
  } catch (e) {}
}
function updateEfforts() {
  const m = codexModels.find(x => x.id === modelOf('codexModel', 'codexModelCustom'));
  const efforts = m ? m.efforts : [];
  $('codexEffort').innerHTML = `<option value="">model default${
    m && m.default_effort ? ` (${m.default_effort})` : ''}</option>` +
    efforts.map(e => `<option value="${e}">${e}</option>`).join('');
}
for (const [selId, inpId] of [['claudeModel', 'claudeModelCustom'],
                              ['codexModel', 'codexModelCustom']]) {
  $(selId).addEventListener('change', () => {
    $(inpId).style.display = $(selId).value === '__custom' ? '' : 'none';
    updateEfforts();
  });
}
$('codexModelCustom').addEventListener('input', updateEfforts);
loadModels();

$('startForm').onsubmit = async e => {
  e.preventDefault();
  if (!$('task').value.trim()) { $('startHint').textContent = 'task required'; return; }
  $('startBtn').disabled = true; $('startHint').textContent = 'starting…';
  const body = {
    task: $('task').value, max_rounds: +$('rounds').value,
    lead_agent: $('leadAgent').value,
    claude_model: modelOf('claudeModel', 'claudeModelCustom'),
    codex_model: modelOf('codexModel', 'codexModelCustom'),
    codex_effort: $('codexEffort').value,
    workdir: $('workdir').value,
  };
  // only ship roles the user actually changed
  if ($('leadRole').value.trim() !== defaultRoles.lead.trim())
    body.lead_role = $('leadRole').value;
  if ($('chalRole').value.trim() !== defaultRoles.challenger.trim())
    body.challenger_role = $('chalRole').value;
  const res = await api('/api/start', {method: 'POST', body: JSON.stringify(body)});
  $('startBtn').disabled = false;
  if (res.error) { $('startHint').textContent = res.error; return; }
  $('startHint').textContent = ''; $('task').value = '';
  select(res.run_id);
};

$('sendBtn').onclick = async () => {
  const text = $('directorMsg').value.trim();
  if (!text || !active) return;
  await api(`/api/message/${active}`, {method: 'POST', body: JSON.stringify({text})});
  $('directorMsg').value = '';
  clearTimeout(pollTimer); poll();
};

$('pauseBtn').onclick = async () => {
  if (!active) return;
  const paused = $('pauseBtn').textContent === 'Resume';
  await api(`/api/${paused ? 'resume' : 'pause'}/${active}`, {method: 'POST'});
  clearTimeout(pollTimer); poll();
};

$('stopBtn').onclick = async () => {
  if (active && confirm('Stop this run? The lead will write a final report from the current state.'))
    await api(`/api/stop/${active}`, {method: 'POST'});
};

refreshRuns();
setInterval(refreshRuns, 10000);
</script>
</body>
</html>
